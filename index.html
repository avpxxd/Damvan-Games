<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Damvan Games Has Closed</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #08080c;
      --card-bg: rgba(18, 18, 28, 0.75);
      --accent-neon-cyan: #00f0ff;
      --accent-neon-pink: #ff2a85;
      --accent-neon-yellow: #ffe600;
      --accent-neon-purple: #9d4edd;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Space Grotesk', sans-serif;
      overflow-x: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Ambient Background Canvas */
    #particle-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* Subtle retro grid overlay */
    .retro-grid {
      position: fixed;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      z-index: 2;
      pointer-events: none;
      mask-image: radial-gradient(circle at center, black 40%, transparent 85%);
      -webkit-mask-image: radial-gradient(circle at center, black 40%, transparent 85%);
    }

    /* Ambient glow blobs */
    .glow-blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(100px);
      z-index: 1;
      pointer-events: none;
      opacity: 0.28;
      animation: float-pulse 8s ease-in-out infinite alternate;
    }

    .blob-1 {
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, var(--accent-neon-purple), transparent 70%);
      top: 10%;
      left: 15%;
    }

    .blob-2 {
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, var(--accent-neon-cyan), transparent 70%);
      bottom: 10%;
      right: 15%;
      animation-delay: -4s;
    }

    @keyframes float-pulse {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(30px, -20px) scale(1.1); }
      100% { transform: translate(-20px, 20px) scale(0.95); }
    }

    /* Main Container */
    .container {
      position: relative;
      z-index: 10;
      max-width: 720px;
      width: 90%;
      margin: 2rem auto;
      text-align: center;
      padding: 3.5rem 2.5rem;
      background: var(--card-bg);
      border-radius: 28px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 
        0 25px 60px -15px rgba(0, 0, 0, 0.8),
        0 0 35px rgba(157, 78, 221, 0.15),
        inset 0 1px 0 rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .container:hover {
      box-shadow: 
        0 30px 70px -15px rgba(0, 0, 0, 0.9),
        0 0 45px rgba(0, 240, 255, 0.2),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }

    /* Floating Game Characters / Icons */
    .floating-icons {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      margin-bottom: 2rem;
      font-size: 2.4rem;
    }

    .floating-icons span {
      display: inline-block;
      cursor: default;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .floating-icons span:hover {
      transform: scale(1.3) rotate(10deg);
    }

    .float-1 { animation: float-icon 3.2s ease-in-out infinite alternate; }
    .float-2 { animation: float-icon 2.8s ease-in-out infinite alternate -0.7s; }
    .float-3 { animation: float-icon 3.6s ease-in-out infinite alternate -1.4s; }
    .float-4 { animation: float-icon 3s ease-in-out infinite alternate -2.1s; }

    @keyframes float-icon {
      0% { transform: translateY(0px) rotate(0deg); }
      100% { transform: translateY(-10px) rotate(-6deg); }
    }

    /* Main Title */
    .title {
      font-family: 'Fredoka', 'Space Grotesk', sans-serif;
      font-size: clamp(2.4rem, 5.5vw, 3.8rem);
      font-weight: 700;
      line-height: 1.15;
      margin-bottom: 1.25rem;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #ffffff 25%, #cbd5e1 60%, var(--accent-neon-cyan) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 30px rgba(0, 240, 255, 0.25);
    }

    /* Subtitle */
    .subtitle {
      font-size: clamp(1.15rem, 2.8vw, 1.4rem);
      font-weight: 400;
      line-height: 1.6;
      color: var(--text-muted);
      max-width: 580px;
      margin: 0 auto 2.2rem;
    }

    /* The one damvan.ca button */
    .cta-button-wrapper {
      margin-top: 0.5rem;
    }

    .cta-button {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 16px 38px;
      background: linear-gradient(135deg, var(--accent-neon-pink), var(--accent-neon-purple));
      color: #ffffff;
      font-size: 1.2rem;
      font-weight: 700;
      border-radius: 50px;
      text-decoration: none;
      box-shadow: 
        0 10px 25px -5px rgba(255, 42, 133, 0.5),
        0 0 20px rgba(157, 78, 221, 0.4);
      transition: all 0.25s ease;
      cursor: pointer;
    }

    .cta-button:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 
        0 15px 35px -5px rgba(255, 42, 133, 0.7),
        0 0 35px rgba(0, 240, 255, 0.5);
    }

    .cta-button:active {
      transform: translateY(-1px) scale(0.99);
    }

    .cta-button svg {
      transition: transform 0.2s ease;
    }

    .cta-button:hover svg {
      transform: translate(2px, -2px);
    }

    /* Responsive adjustments */
    @media (max-width: 600px) {
      .container {
        padding: 2.5rem 1.5rem;
        border-radius: 20px;
      }
      .floating-icons {
        font-size: 2rem;
        gap: 1.2rem;
      }
      .cta-button {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <!-- Ambient background lighting -->
  <div class="glow-blob blob-1"></div>
  <div class="glow-blob blob-2"></div>
  <div class="retro-grid"></div>

  <!-- Ambient floating particles -->
  <canvas id="particle-canvas"></canvas>

  <main class="container">
    <!-- Playful animated gaming emojis -->
    <div class="floating-icons" aria-hidden="true">
      <span class="float-1" title="Joystick">🕹️</span>
      <span class="float-2" title="Pixel Ghost">👾</span>
      <span class="float-3" title="Game Controller">🎮</span>
      <span class="float-4" title="Rocket">🚀</span>
    </div>

    <!-- Main Title -->
    <h1 class="title">Damvan Games Has Closed.</h1>

    <!-- Subtitle -->
    <p class="subtitle">
      but we're not done yet, stay tuned, and check out
    </p>

    <!-- The one damvan.ca button -->
    <div class="cta-button-wrapper">
      <a href="https://damvan.ca" class="cta-button" target="_blank" rel="noopener noreferrer">
        <span>damvan.ca</span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="7" y1="17" x2="17" y2="7"></line>
          <polyline points="7 7 17 7 17 17"></polyline>
        </svg>
      </a>
    </div>
  </main>

  <script>
    // Canvas ambient floating particles
    const canvas = document.getElementById('particle-canvas');
    const ctx = canvas.getContext('2d');

    let width = (canvas.width = window.innerWidth);
    let height = (canvas.height = window.innerHeight);

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    const colors = ['#00f0ff', '#ff2a85', '#ffe600', '#9d4edd', '#ffffff'];
    const particles = [];
    const maxParticles = 60;

    class AmbientParticle {
      constructor() {
        this.reset();
      }

      reset() {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
        this.size = Math.random() * 2.5 + 1;
        this.color = colors[Math.floor(Math.random() * colors.length)];
        this.vx = (Math.random() - 0.5) * 0.5;
        this.vy = (Math.random() - 0.5) * 0.5;
        this.alpha = Math.random() * 0.6 + 0.2;
        this.pulseSpeed = Math.random() * 0.02 + 0.01;
        this.shape = Math.random() > 0.4 ? 'circle' : 'plus';
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.alpha += Math.sin(Date.now() * this.pulseSpeed) * 0.01;

        if (this.x < -10) this.x = width + 10;
        if (this.x > width + 10) this.x = -10;
        if (this.y < -10) this.y = height + 10;
        if (this.y > height + 10) this.y = -10;
      }

      draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(0.1, Math.min(0.8, this.alpha));
        ctx.fillStyle = this.color;
        ctx.strokeStyle = this.color;

        if (this.shape === 'circle') {
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(this.x - this.size * 1.5, this.y);
          ctx.lineTo(this.x + this.size * 1.5, this.y);
          ctx.moveTo(this.x, this.y - this.size * 1.5);
          ctx.lineTo(this.x, this.y + this.size * 1.5);
          ctx.stroke();
        }
        ctx.restore();
      }
    }

    for (let i = 0; i < maxParticles; i++) {
      particles.push(new AmbientParticle());
    }

    function animate() {
      ctx.clearRect(0, 0, width, height);

      for (let i = 0; i < particles.length; i++) {
        particles[i].update();
        particles[i].draw();
      }

      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
