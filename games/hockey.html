<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laser Hockey - Air Hockey Edition</title>
    <style>
        body {
            background-color: #050505;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            overflow: hidden; /* Prevents scrollbars */
            user-select: none; /* Prevent text selection while playing */
        }
        canvas {
            background: #000;
            border: 2px solid #333;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.1);
            border-radius: 15px;
            cursor: none; /* Hide standard cursor over the board */
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth - 40; // Full screen minus small 20px padding
            canvas.height = window.innerHeight - 40;
        }
        resizeCanvas();

        // --- Audio Setup ---
        const audio = {
            bgm: new Audio('/games/audio/gameplay_bgm.wav'),
            resultsBgm: new Audio('/games/audio/results_bgm.wav'),
            blueGoal: new Audio('/games/audio/blue_goal.wav'),
            redGoal: new Audio('/games/audio/red_goal.wav'),
            puckAfterhit: new Audio('/games/audio/puck_afterhit.wav'),
            puckAfterhit2: new Audio('/games/audio/puck_afterhit_2.wav'),
            goalUnderlay: new Audio('/games/audio/goal_underlay.wav'),
            goalUnderlay2: new Audio('/games/audio/goal_underlay_2.wav'),
            p1Point: new Audio('/games/audio/p1_point_gain.wav'),
            p2Point: new Audio('/games/audio/p2_point_gain.wav'),
            blueHit: new Audio('/games/audio/blue_hit.wav'),
            redHit: new Audio('/games/audio/red_hit.wav'),
            wallHit: new Audio('/games/audio/wall_hit.wav')
        };
        audio.bgm.loop = true;

        function playSound(sound) {
            sound.currentTime = 0; 
            sound.play().catch(e => console.log("Audio play prevented", e));
        }

        // --- Game Variables ---
        let goalHeight = canvas.height * 0.45;
        let goalTop = canvas.height / 2 - goalHeight / 2;
        let goalBottom = canvas.height / 2 + goalHeight / 2;

        window.addEventListener('resize', () => {
            resizeCanvas();
            goalHeight = canvas.height * 0.45;
            goalTop = canvas.height / 2 - goalHeight / 2;
            goalBottom = canvas.height / 2 + goalHeight / 2;
            p1.startX = canvas.width * 0.15;
            p1.startY = canvas.height / 2;
            p2.startX = canvas.width * 0.85;
            p2.startY = canvas.height / 2;
        });

        let gameRunning = false;
        let isResetting = false;
        let matchTimer = 99;
        let timerInterval = null;
        let goalMessage = "";
        let goalColor = "";
        let showResults = false;
        let lastScorer = null;
        
        let isPaused = false;
        const flashes = { TL: 0, TR: 0, BL: 0, BR: 0 }; // Flash intensities for corners

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && gameRunning && !showResults) {
                isPaused = !isPaused;
                if (isPaused) {
                    audio.bgm.pause();
                } else {
                    audio.bgm.play().catch(e => console.log("BGM error", e));
                }
            }
        });

        // Player 1 (Mouse Control)
        const p1 = {
            startX: canvas.width * 0.15, startY: canvas.height / 2,
            x: canvas.width * 0.15, y: canvas.height / 2, w: 32, h: 120, 
            targetX: canvas.width * 0.15, targetY: canvas.height / 2,
            vx: 0, vy: 0, color: '#3366ff', score: 0
        };

        // Player 2 (AI Control)
        const p2 = {
            startX: canvas.width * 0.85, startY: canvas.height / 2,
            x: canvas.width * 0.85, y: canvas.height / 2, w: 32, h: 120, 
            vx: 0, vy: 0, color: '#ff3333', score: 0,
            speed: 8 // Scaled up AI speed for bigger field
        };

        // Puck
        const puck = {
            x: canvas.width / 2, y: canvas.height / 2, radius: 24,
            vx: 0, vy: 0, color: '#ffcc00', baseSpeed: 14, history: []
        };

        // --- Mouse Tracking ---
        canvas.addEventListener('mousemove', (e) => {
            if (!gameRunning) return;
            const rect = canvas.getBoundingClientRect();
            let mouseX = e.clientX - rect.left;
            let mouseY = e.clientY - rect.top;

            // Restrict P1 target to the left half and within borders
            p1.targetX = Math.max(p1.w / 2, Math.min(canvas.width / 2 - p1.w / 2 - 5, mouseX));
            p1.targetY = Math.max(p1.h / 2, Math.min(canvas.height - p1.h / 2, mouseY));
        });

        function resetPuck(direction, scorer) {
            isResetting = true;
            puck.x = canvas.width / 2;
            puck.y = canvas.height / 2;
            puck.vx = 0;
            puck.vy = 0;
            puck.history = []; // Clear trail
            
            lastScorer = scorer;

            if (scorer) {
                goalMessage = "Goal!";
            } else {
                goalMessage = "";
            }

            // Wait before serving
            setTimeout(() => {
                goalMessage = "";
                lastScorer = null;
                if (gameRunning) {
                    puck.vx = direction * puck.baseSpeed;
                    puck.vy = (Math.random() > 0.5 ? 1 : -1) * (Math.random() * 4 + 2);
                    isResetting = false;
                }
            }, 3500);
        }

        // --- Physics & Math ---
        function clamp(val, min, max) {
            return Math.max(min, Math.min(max, val));
        }

        function checkPaddleCollision(paddle, isPlayer1) {
            // Find closest point on the paddle's AABB to the puck
            let closestX = clamp(puck.x, paddle.x - paddle.w/2, paddle.x + paddle.w/2);
            let closestY = clamp(puck.y, paddle.y - paddle.h/2, paddle.y + paddle.h/2);

            let distanceX = puck.x - closestX;
            let distanceY = puck.y - closestY;

            let distanceSquared = (distanceX * distanceX) + (distanceY * distanceY);

            // Collision occurred
            if (distanceSquared < (puck.radius * puck.radius)) {
                let distance = Math.sqrt(distanceSquared);
                if (distance === 0) {
                    distance = 1;
                    distanceX = isPlayer1 ? 1 : -1;
                }

                let overlap = puck.radius - distance;
                let nx = distanceX / distance;
                let ny = distanceY / distance;

                // Push puck out of paddle to prevent sticking/tunneling
                puck.x += nx * overlap;
                puck.y += ny * overlap;

                // --- Curved Collision Logic ---
                // Determine intersection relative to the paddle center (-1 to 1)
                let relativeIntersectY = paddle.y - puck.y;
                let normalizedIntersectY = relativeIntersectY / (paddle.h / 2);

                // Max bounce angle extended to ~117 degrees (Math.PI * 0.65)
                // This creates the full () curve! Hitting the extreme edges will bounce the puck backwards.
                let bounceAngle = normalizedIntersectY * (Math.PI * 0.65);

                // Calculate current speed and add some paddle momentum
                let speed = Math.sqrt(puck.vx * puck.vx + puck.vy * puck.vy);
                speed = Math.min(speed * 1.05 + Math.abs(paddle.vx) * 0.1, 25);

                // Check which side of the paddle the puck actually hit. 
                // This allows hitting the puck with the *back* of the paddle for an own-goal too!
                let dir = isPlayer1 ? 1 : -1;
                if (distanceX > 0) dir = 1;
                else if (distanceX < 0) dir = -1;

                // Apply new velocity based on angle to simulate a curved parenthesis () shape
                puck.vx = speed * Math.cos(bounceAngle) * dir;
                puck.vy = speed * -Math.sin(bounceAngle); // Negative sin because canvas Y goes down

                if (isPlayer1) playSound(audio.blueHit);
                else playSound(audio.redHit);
            }
        }

        function update() {
            if (!gameRunning || isPaused) return;

            // Decay corner flashes softly
            flashes.TL = Math.max(0, flashes.TL - 0.03);
            flashes.TR = Math.max(0, flashes.TR - 0.03);
            flashes.BL = Math.max(0, flashes.BL - 0.03);
            flashes.BR = Math.max(0, flashes.BR - 0.03);

            if (isResetting) {
                // Slide players back to start positions smoothly during goal screen
                p1.vx = (p1.startX - p1.x) * 0.03;
                p1.vy = (p1.startY - p1.y) * 0.03;
                p1.x += p1.vx;
                p1.y += p1.vy;

                p2.vx = (p2.startX - p2.x) * 0.03;
                p2.vy = (p2.startY - p2.y) * 0.03;
                p2.x += p2.vx;
                p2.y += p2.vy;
                
                return; // Skip puck physics and collision while resetting
            }

            // --- Player 1 Update (Smooth follow) ---
            p1.vx = (p1.targetX - p1.x) * 0.4;
            p1.vy = (p1.targetY - p1.y) * 0.4;
            p1.x += p1.vx;
            p1.y += p1.vy;

            // --- Player 2 Update (Smarter AI) ---
            let aiTargetY = p2.startY;
            let aiTargetX = p2.startX; // Resting position closer to center
            
            // If puck is on AI's half, ALWAYS aggressively attack
            if (puck.x > canvas.width * 0.5) {
                aiTargetX = puck.x - 20; 
                aiTargetY = puck.y;
            } else {
                // Puck is on player's half
                if (puck.vx > 0) { 
                    // Predict puck Y intersection using geometry
                    let predictedY = puck.y + (puck.vy / puck.vx) * (p2.x - puck.x);
                    let bounces = 0;
                    while (predictedY < 0 || predictedY > canvas.height) {
                        if (predictedY < 0) predictedY = -predictedY;
                        if (predictedY > canvas.height) predictedY = 2 * canvas.height - predictedY;
                        bounces++;
                        if(bounces > 5) break; // Sanity check to prevent infinite loops
                    }
                    aiTargetY = predictedY;
                } else {
                    // Return to center but lightly track Y
                    aiTargetY = puck.y;
                }
            }

            // Move AI
            let dx = aiTargetX - p2.x;
            let dy = aiTargetY - p2.y;
            let dist = Math.sqrt(dx * dx + dy * dy);
            
            if (dist > 0) {
                p2.vx = (dx / dist) * Math.min(dist, p2.speed);
                p2.vy = (dy / dist) * Math.min(dist, p2.speed);
                p2.x += p2.vx;
                p2.y += p2.vy;
            }

            // Constrain AI
            p2.x = clamp(p2.x, canvas.width / 2 + p2.w / 2 + 5, canvas.width - p2.w / 2);
            p2.y = clamp(p2.y, p2.h / 2, canvas.height - p2.h / 2);


            // --- Puck Update ---
            puck.history.unshift({x: puck.x, y: puck.y});
            if (puck.history.length > 10) puck.history.pop();

            puck.x += puck.vx;
            puck.y += puck.vy;

            // Apply friction (air hockey tables have low friction)
            puck.vx *= 0.995;
            puck.vy *= 0.995;

            // Wall Collisions & Goals
            // Top and Bottom walls
            if (puck.y - puck.radius < 0) {
                puck.y = puck.radius;
                puck.vy *= -1;
                playSound(audio.wallHit);
                playSound(audio.puckAfterhit);
                if (puck.x < canvas.width / 2) flashes.TL = 1; else flashes.TR = 1;
            } else if (puck.y + puck.radius > canvas.height) {
                puck.y = canvas.height - puck.radius;
                puck.vy *= -1;
                playSound(audio.wallHit);
                playSound(audio.puckAfterhit2);
                if (puck.x < canvas.width / 2) flashes.BL = 1; else flashes.BR = 1;
            }

            // Left Wall / Blue Goal
            if (puck.x - puck.radius < 0) {
                if (puck.y > goalTop && puck.y < goalBottom) {
                    p2.score++;
                    playSound(audio.redGoal);
                    playSound(audio.p2Point);
                    playSound(audio.goalUnderlay);
                    resetPuck(1, 'p2');
                    return;
                } else {
                    puck.x = puck.radius;
                    puck.vx *= -0.8;
                    playSound(audio.wallHit);
                    if (puck.y < canvas.height / 2) flashes.TL = 1; else flashes.BL = 1;
                }
            }

            // Right Wall / Red Goal
            if (puck.x + puck.radius > canvas.width) {
                if (puck.y > goalTop && puck.y < goalBottom) {
                    p1.score++;
                    playSound(audio.blueGoal);
                    playSound(audio.p1Point);
                    playSound(audio.goalUnderlay2);
                    resetPuck(-1, 'p1');
                    return;
                } else {
                    puck.x = canvas.width - puck.radius;
                    puck.vx *= -0.8;
                    playSound(audio.wallHit);
                    if (puck.y < canvas.height / 2) flashes.TR = 1; else flashes.BR = 1;
                }
            }

            // Check Paddle Collisions
            checkPaddleCollision(p1, true);
            checkPaddleCollision(p2, false);
        }

        // --- Rendering ---
        function drawBracket(x, y, w, h, color, isLeft) {
            ctx.strokeStyle = color;
            ctx.lineWidth = 10;
            ctx.lineCap = "round";
            ctx.lineJoin = "round";
            ctx.shadowBlur = 20;
            ctx.shadowColor = color;
            ctx.beginPath();
            
            const left = x - w/2;
            const right = x + w/2;
            const top = y - h/2;
            const bottom = y + h/2;

            if (isLeft) {
                // Draw ]
                ctx.moveTo(left, top);
                ctx.lineTo(right, top);
                ctx.lineTo(right, bottom);
                ctx.lineTo(left, bottom);
            } else {
                // Draw [
                ctx.moveTo(right, top);
                ctx.lineTo(left, top);
                ctx.lineTo(left, bottom);
                ctx.lineTo(right, bottom);
            }
            ctx.stroke();
            ctx.shadowBlur = 0; // Reset
        }

        function drawPuck() {
            // Draw glowing trail
            ctx.shadowBlur = 15;
            ctx.shadowColor = puck.color;
            for (let i = 0; i < puck.history.length; i++) {
                let pt = puck.history[i];
                let alpha = 1 - (i / puck.history.length);
                ctx.fillStyle = `rgba(255, 200, 0, ${alpha * 0.5})`;
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, Math.max(puck.radius - i*0.8, 1), 0, Math.PI * 2);
                ctx.fill();
                ctx.closePath();
            }

            // Draw puck core
            ctx.fillStyle = '#fff';
            ctx.shadowColor = '#ffcc00';
            ctx.shadowBlur = 20;
            ctx.beginPath();
            ctx.arc(puck.x, puck.y, puck.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.closePath();
            ctx.shadowBlur = 0;
        }

        function drawNeonArc(x, y, radius, startAngle, endAngle, color, blurAmount = 15) {
            ctx.strokeStyle = color;
            ctx.shadowColor = color;
            ctx.shadowBlur = blurAmount;
            ctx.beginPath();
            ctx.arc(x, y, radius, startAngle, endAngle);
            ctx.stroke();
        }

        function drawNeonLine(x1, y1, x2, y2, color, blurAmount = 15) {
            ctx.strokeStyle = color;
            ctx.shadowColor = color;
            ctx.shadowBlur = blurAmount;
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();
        }

        function drawField() {
            // Background
            ctx.fillStyle = '#050505';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Dark field markings
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.lineWidth = 6;
            ctx.shadowBlur = 0;
            
            // Center Line
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 30);
            ctx.lineTo(canvas.width / 2, canvas.height - 30);
            ctx.stroke();
            
            // Center Circles
            ctx.beginPath();
            ctx.arc(canvas.width / 2, canvas.height / 2, 120, 0, Math.PI * 2);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(canvas.width / 2, canvas.height / 2, 60, 0, Math.PI * 2);
            ctx.stroke();

            // Goal semi-circles
            ctx.beginPath();
            ctx.arc(0, canvas.height / 2, 180, -Math.PI/2, Math.PI/2);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(0, canvas.height / 2, 120, -Math.PI/2, Math.PI/2);
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(canvas.width, canvas.height / 2, 180, Math.PI/2, Math.PI*1.5);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(canvas.width, canvas.height / 2, 120, Math.PI/2, Math.PI*1.5);
            ctx.stroke();

            // Outer Neon Border (Recreating the screenshot layout)
            ctx.lineWidth = 10;
            ctx.lineCap = "round";

            const bPad = 20;
            const r = 40; // corner radius
            
            // Calculate current blur intensity based on flash state
            let bTL = 15 + (flashes.TL * 35);
            let bTR = 15 + (flashes.TR * 35);
            let bBL = 15 + (flashes.BL * 35);
            let bBR = 15 + (flashes.BR * 35);

            // Top Left (Red)
            drawNeonLine(bPad + r, bPad, canvas.width/2 - 150, bPad, '#ff3333', bTL);
            drawNeonArc(bPad + r, bPad + r, r, Math.PI, Math.PI*1.5, '#ff3333', bTL);
            drawNeonLine(bPad, bPad + r, bPad, goalTop - 10, '#ff3333', bTL);

            // Bottom Left (Blue)
            drawNeonLine(bPad + r, canvas.height - bPad, canvas.width/2 - 100, canvas.height - bPad, '#3366ff', bBL);
            drawNeonArc(bPad + r, canvas.height - bPad - r, r, Math.PI/2, Math.PI, '#3366ff', bBL);
            drawNeonLine(bPad, canvas.height - bPad - r, bPad, goalBottom + 10, '#3366ff', bBL);

            // Left Goal Gap markers (Purple)
            drawNeonLine(bPad, goalTop + 10, bPad, goalTop + 30, '#cc33ff');
            drawNeonLine(bPad, goalBottom - 30, bPad, goalBottom - 10, '#cc33ff');

            // Top Right (Yellow/Orange)
            drawNeonLine(canvas.width/2 + 150, bPad, canvas.width - bPad - r, bPad, '#ffcc00', bTR);
            drawNeonArc(canvas.width - bPad - r, bPad + r, r, Math.PI*1.5, 0, '#ffcc00', bTR);
            drawNeonLine(canvas.width - bPad, bPad + r, canvas.width - bPad, goalTop - 10, '#ffcc00', bTR);

            // Bottom Right (Green)
            drawNeonLine(canvas.width/2 + 100, canvas.height - bPad, canvas.width - bPad - r, canvas.height - bPad, '#33cc33', bBR);
            drawNeonArc(canvas.width - bPad - r, canvas.height - bPad - r, r, 0, Math.PI/2, '#33cc33', bBR);
            drawNeonLine(canvas.width - bPad, canvas.height - bPad - r, canvas.width - bPad, goalBottom + 10, '#33cc33', bBR);

            // Right Goal Gap markers (Yellow)
            drawNeonLine(canvas.width - bPad, goalTop + 10, canvas.width - bPad, goalTop + 30, '#ffff66');
            drawNeonLine(canvas.width - bPad, goalBottom - 30, canvas.width - bPad, goalBottom - 10, '#ffff66');

            ctx.shadowBlur = 0; // reset

            // Top Score Pill
            ctx.strokeStyle = '#ff66cc'; // Pinkish
            ctx.shadowColor = '#ff66cc';
            ctx.shadowBlur = 10;
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.roundRect(canvas.width/2 - 130, 8, 260, 34, 17);
            ctx.stroke();

            ctx.shadowBlur = 0;
            ctx.font = 'bold 20px "Courier New", Courier, monospace';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            // Score Text
            ctx.fillStyle = '#0ff';
            ctx.fillText('P1', canvas.width/2 - 90, 26);
            
            ctx.fillStyle = '#fff';
            ctx.shadowColor = '#fff';
            ctx.shadowBlur = 5;
            ctx.font = 'bold 24px "Courier New", Courier, monospace';
            let formattedP1 = p1.score.toString().padStart(2, '0');
            let formattedP2 = p2.score.toString().padStart(2, '0');
            ctx.fillText(`${formattedP1} - ${formattedP2}`, canvas.width/2, 26);
            
            ctx.shadowBlur = 0;
            ctx.font = 'bold 20px "Courier New", Courier, monospace';
            ctx.fillStyle = '#ff3333';
            ctx.fillText('CPU', canvas.width/2 + 90, 26);

            // Bottom Timer Pill
            ctx.strokeStyle = '#aaaaaa'; 
            ctx.shadowColor = '#aaaaaa';
            ctx.shadowBlur = 10;
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.roundRect(canvas.width/2 - 80, canvas.height - 42, 160, 34, 17);
            ctx.stroke();

            ctx.shadowBlur = 0;
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 22px "Courier New", Courier, monospace';
            ctx.fillText(`🕒  ${matchTimer}`, canvas.width/2, canvas.height - 24);
        }

        function draw() {
            drawField();
            drawBracket(p1.x, p1.y, p1.w, p1.h, p1.color, true);
            drawBracket(p2.x, p2.y, p2.w, p2.h, p2.color, false);
            drawPuck();

            // Goal & Results Screen Overlay
            if (goalMessage || showResults) {
                let text = showResults ? "Game Over" : "Goal!";
                
                // Draw Main Text Outline (Goal / Game Over)
                ctx.font = 'bold 80px "Arial Rounded MT Bold", Arial, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                
                ctx.shadowBlur = 25;
                ctx.shadowColor = '#00ffff';
                ctx.strokeStyle = '#00ffff';
                ctx.lineWidth = 8;
                ctx.strokeText(text, canvas.width / 2, canvas.height / 2 - 40);
                
                // Fill Main Text (Dark inside)
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#050505'; 
                ctx.fillText(text, canvas.width / 2, canvas.height / 2 - 40);

                // Set up font for the scores
                ctx.font = 'bold 60px "Arial Rounded MT Bold", Arial, sans-serif';
                let formattedP1 = p1.score.toString().padStart(2, '0');
                let formattedP2 = p2.score.toString().padStart(2, '0');
                let dash = " - ";

                // Measure widths to perfectly center the multi-colored string
                let wP1 = ctx.measureText(formattedP1).width;
                let wDash = ctx.measureText(dash).width;
                let wP2 = ctx.measureText(formattedP2).width;
                let totalW = wP1 + wDash + wP2;
                let startX = canvas.width / 2 - totalW / 2;
                let y = canvas.height / 2 + 40;

                // --- Flashing Yellow to White Logic ---
                // Math.sin creates a smooth wave between -1 and 1. 
                // We normalize it to 0-1 to blend between RGB(255, 204, 0) and RGB(255, 255, 255)
                let cycle = (Math.sin(Date.now() / 250) + 1) / 2;
                let g = Math.floor(204 + (51 * cycle));
                let b = Math.floor(255 * cycle);
                let flashYellow = `rgb(255, ${g}, ${b})`;

                let p1Color = '#ffffff';
                let p2Color = '#ffffff';
                let p1Glow = 0;
                let p2Glow = 0;

                if (goalMessage) {
                    if (lastScorer === 'p1') { p1Color = flashYellow; p1Glow = 15; }
                    if (lastScorer === 'p2') { p2Color = flashYellow; p2Glow = 15; }
                } else if (showResults) {
                    if (p1.score > p2.score) { p1Color = flashYellow; p1Glow = 15; }
                    if (p2.score > p1.score) { p2Color = flashYellow; p2Glow = 15; }
                }

                // Draw P1 Score
                ctx.textAlign = 'left';
                ctx.fillStyle = p1Color;
                ctx.shadowColor = p1Color;
                ctx.shadowBlur = p1Glow;
                ctx.fillText(formattedP1, startX, y);

                // Draw Dash (White)
                startX += wP1;
                ctx.fillStyle = '#ffffff';
                ctx.shadowColor = '#ffffff';
                ctx.shadowBlur = 0;
                ctx.fillText(dash, startX, y);

                // Draw P2 Score
                startX += wDash;
                ctx.fillStyle = p2Color;
                ctx.shadowColor = p2Color;
                ctx.shadowBlur = p2Glow;
                ctx.fillText(formattedP2, startX, y);
                
                ctx.shadowBlur = 0;

                if (showResults) {
                    ctx.font = 'bold 30px "Courier New", Courier, monospace';
                    ctx.fillStyle = '#fff';
                    ctx.fillText("CLICK TO PLAY AGAIN", canvas.width / 2, canvas.height / 2 + 140);
                }
            } else if (isPaused) {
                // Pause Overlay
                ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = '#fff';
                ctx.shadowColor = '#fff';
                ctx.shadowBlur = 15;
                ctx.font = 'bold 60px "Courier New", Courier, monospace';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText("PAUSED", canvas.width / 2, canvas.height / 2);
                ctx.shadowBlur = 0;
            } else if (!gameRunning) {
                // Click to Start Overlay
                ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = '#0ff';
                ctx.shadowColor = '#0ff';
                ctx.shadowBlur = 15;
                ctx.font = 'bold 40px "Courier New", Courier, monospace';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText("CLICK TO START", canvas.width / 2, canvas.height / 2);
                ctx.shadowBlur = 0;
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // --- Initialization ---
        canvas.addEventListener('mousedown', () => {
            if (!gameRunning) {
                gameRunning = true;
                showResults = false;
                matchTimer = 99;
                p1.score = 0;
                p2.score = 0;
                audio.bgm.play().catch(e => console.log("BGM error", e));
                resetPuck(1, null);
                
                if(timerInterval) clearInterval(timerInterval);
                timerInterval = setInterval(() => {
                    if(isResetting || isPaused) return; // Don't count down while waiting for puck or paused
                    matchTimer--;
                    if(matchTimer <= 0) {
                        matchTimer = 0;
                        gameRunning = false;
                        showResults = true;
                        clearInterval(timerInterval);
                        audio.bgm.pause();
                        playSound(audio.resultsBgm);
                    }
                }, 1000);
            }
        });

        // Initial render
        draw();
        gameLoop();
    </script>
</body>
</html>
