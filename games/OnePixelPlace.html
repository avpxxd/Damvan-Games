<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One Pixel Place</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom styles for animations and specific visual effects */
        body {
            background-color: #0f172a; /* Slate 900 */
            color: #f8fafc; /* Slate 50 */
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* The Pixel */
        #the-pixel-container {
            width: 250px;
            height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: repeating-conic-gradient(#334155 0% 25%, transparent 0% 50%) 50% / 20px 20px;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), inset 0 2px 4px 0 rgba(255, 255, 255, 0.1);
            position: relative;
            cursor: pointer;
            transition: transform 0.1s ease;
        }
        
        #the-pixel-container:active {
            transform: scale(0.98);
        }

        #the-pixel {
            width: 100%;
            height: 100%;
            border-radius: 8px; /* Slightly less than container */
            transition: background-color 0.2s ease;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.1);
        }

        /* Color Palette */
        .color-swatch {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 3px solid transparent;
        }

        .color-swatch:hover {
            transform: scale(1.1);
        }

        .color-swatch.selected {
            border-color: white;
            box-shadow: 0 0 10px rgba(255,255,255,0.5);
            transform: scale(1.15);
        }

        /* Cooldown Overlay */
        #cooldown-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            backdrop-filter: blur(2px);
        }

        #cooldown-overlay.active {
            opacity: 1;
            pointer-events: auto; /* Block clicks during cooldown */
        }

        /* Leaderboard Animations */
        .leaderboard-row {
            transition: all 0.3s ease;
        }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b;
        }
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }
    </style>
</head>
<body class="antialiased selection:bg-indigo-500 selection:text-white">

    <div id="app" class="flex flex-col lg:flex-row flex-grow w-full max-w-6xl mx-auto p-4 gap-6">
        
        <!-- Left Column: The Pixel and Controls -->
        <main class="flex-1 flex flex-col items-center justify-start pt-8 gap-8">
            
            <header class="text-center space-y-2">
                <h1 class="text-5xl font-extrabold tracking-tight bg-gradient-to-r from-blue-400 via-indigo-400 to-purple-400 text-transparent bg-clip-text drop-shadow-sm">
                    One Pixel Place
                </h1>
                <p class="text-slate-400 text-lg">Leave your mark. Defend it.</p>
            </header>

            <!-- Current Owner Info -->
            <div id="status-card" class="bg-slate-800/50 backdrop-blur-md border border-slate-700 p-4 rounded-2xl shadow-xl flex flex-col items-center w-full max-w-sm transition-all">
                <p class="text-sm text-slate-400 uppercase tracking-wider font-semibold mb-1">Currently Held By</p>
                <div class="flex items-center gap-3">
                    <div id="current-owner-color" class="w-4 h-4 rounded-full bg-transparent shadow-sm"></div>
                    <p id="current-owner-name" class="text-xl font-bold text-white">Loading...</p>
                </div>
                <div class="mt-2 text-sm text-slate-300 bg-slate-900/50 px-3 py-1 rounded-full font-mono">
                    Time: <span id="current-hold-time">00:00:00</span>
                </div>
            </div>

            <!-- The Pixel -->
            <div id="the-pixel-container" class="group">
                <div id="the-pixel" style="background-color: transparent;"></div>
                <div id="cooldown-overlay">
                    <span id="cooldown-timer">5.0</span>
                </div>
                <!-- Tooltip for action -->
                <div class="absolute -bottom-10 left-1/2 -translate-x-1/2 opacity-0 group-hover:opacity-100 transition-opacity text-sm text-slate-400 pointer-events-none whitespace-nowrap">
                    Click to capture
                </div>
            </div>

            <!-- Color Palette -->
            <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700 shadow-xl w-full max-w-sm">
                <p class="text-xs text-slate-400 uppercase tracking-wider font-semibold mb-3 text-center">Select Color</p>
                <div id="palette" class="flex flex-wrap justify-center gap-2">
                    <!-- Colors injected by JS -->
                </div>
            </div>
            
        </main>

        <!-- Right Column: Leaderboard -->
        <aside class="w-full lg:w-96 flex flex-col h-[600px] lg:h-auto lg:max-h-[calc(100vh-2rem)] gap-4">
            
            <!-- User Identification Area -->
            <div id="user-info-section" class="bg-slate-800 border border-slate-700 p-4 rounded-2xl shadow-xl w-full flex flex-col items-center gap-2 hidden shrink-0">
                 <p class="text-xs text-slate-400 uppercase tracking-wider font-semibold w-full text-left">Playing as</p>
                 <div class="flex w-full shadow-sm">
                     <input type="text" id="username-input" class="flex-1 bg-slate-900 border border-slate-700 rounded-l-lg px-4 py-2 text-white focus:outline-none focus:border-indigo-500 transition-colors" placeholder="Enter username..." maxlength="15">
                     <button id="save-username-btn" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-r-lg font-medium transition-colors border border-indigo-600">Save</button>
                 </div>
            </div>

            <div class="bg-slate-800 border border-slate-700 rounded-2xl shadow-2xl flex flex-col h-full overflow-hidden">
                <div class="p-5 border-b border-slate-700 bg-slate-800/80 backdrop-blur sticky top-0 z-10 flex justify-between items-center">
                    <h2 class="text-xl font-bold flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-yellow-500"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                        All-Time Leaderboard
                    </h2>
                    <span class="text-xs bg-slate-700 text-slate-300 px-2 py-1 rounded-md">Total Time</span>
                </div>
                
                <div class="flex-1 overflow-y-auto p-2" id="leaderboard-container">
                    <div id="leaderboard-list" class="flex flex-col gap-1">
                        <!-- Leaderboard entries injected by JS -->
                        <div class="text-center text-slate-500 p-4 animate-pulse">Loading leaderboard...</div>
                    </div>
                </div>
            </div>
        </aside>
    </div>

    <!-- Error Modal Template -->
    <div id="error-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-50 opacity-0 pointer-events-none transition-opacity">
        <div class="bg-slate-800 border border-red-500/50 p-6 rounded-2xl shadow-2xl max-w-sm w-full mx-4 transform scale-95 transition-transform">
            <h3 class="text-xl font-bold text-red-400 mb-2 flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                Error
            </h3>
            <p id="error-message" class="text-slate-300 mb-6 text-sm">Something went wrong.</p>
            <button id="close-error-btn" class="w-full bg-slate-700 hover:bg-slate-600 text-white py-2 rounded-lg transition-colors font-medium">Close</button>
        </div>
    </div>


    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, updateProfile } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, onSnapshot, collection, query, runTransaction, serverTimestamp, Timestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // =========================================================================
        // 🛑 YOUR FIREBASE CONFIGURATION GOES HERE 🛑
        // Replace the empty strings below with the values from your Firebase Console.
        // =========================================================================
        const firebaseConfig = {
            apiKey: "AIzaSyB0kcX8UQ5Cel8NHIuQn6dNCD4Afe1kdSs",
            authDomain: "onepixelplace.firebaseapp.com",
            projectId: "onepixelplace",
            storageBucket: "onepixelplace.firebasestorage.app",
            messagingSenderId: "134860608855",
            appId: "1:134860608855:web:2be73950b7e25685edda12"
        };

        // If you don't paste your config above, the app will throw an error immediately.
        if (!firebaseConfig.apiKey) {
            console.error("FIREBASE CONFIG MISSING! Please add your config to the code.");
        }

        const appId = 'one-pixel-place-app'; // Used for the database path
        
        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // --- State ---
        let currentUser = null;
        let selectedColor = '#ef4444'; // Default red
        let currentPixelState = null; // Holds data from DB
        let cooldownActive = false;
        const COOLDOWN_DURATION = 5000; // 5 seconds
        let localHoldTimeInterval = null;
        let lastKnownOwnerTime = 0;
        
        // Database Paths
        const PIXEL_COLLECTION_NAME = 'onePixelState';
        const LEADERBOARD_COLLECTION_NAME = 'pixelLeaderboard';

        // Predefined r/place style colors
        const PALETTE = [
            '#ffffff', '#e4e4e4', '#888888', '#222222', '#ffa7d1', '#e50000', '#e59500', '#a06a42',
            '#e5d900', '#94e044', '#02be01', '#00e5f0', '#0083c7', '#0000ea', '#e04aff', '#820080'
        ];

        // --- DOM Elements ---
        const pixelEl = document.getElementById('the-pixel');
        const pixelContainer = document.getElementById('the-pixel-container');
        const paletteContainer = document.getElementById('palette');
        const ownerNameEl = document.getElementById('current-owner-name');
        const ownerColorEl = document.getElementById('current-owner-color');
        const holdTimeEl = document.getElementById('current-hold-time');
        const cooldownOverlay = document.getElementById('cooldown-overlay');
        const cooldownTimerEl = document.getElementById('cooldown-timer');
        const leaderboardList = document.getElementById('leaderboard-list');
        const userInfoSection = document.getElementById('user-info-section');
        const usernameInput = document.getElementById('username-input');
        const saveUsernameBtn = document.getElementById('save-username-btn');
        const errorModal = document.getElementById('error-modal');
        const errorMessage = document.getElementById('error-message');
        const closeErrorBtn = document.getElementById('close-error-btn');


        // --- UI Setup & Helpers ---
        
        function showError(msg) {
            errorMessage.textContent = msg;
            errorModal.classList.remove('opacity-0', 'pointer-events-none');
            errorModal.querySelector('div').classList.remove('scale-95');
        }

        closeErrorBtn.addEventListener('click', () => {
            errorModal.classList.add('opacity-0', 'pointer-events-none');
            errorModal.querySelector('div').classList.add('scale-95');
        });

        function buildPalette() {
            paletteContainer.innerHTML = '';
            PALETTE.forEach(color => {
                const btn = document.createElement('div');
                btn.className = `color-swatch ${color === selectedColor ? 'selected' : ''}`;
                btn.style.backgroundColor = color;
                btn.addEventListener('click', () => {
                    selectedColor = color;
                    updatePaletteSelection();
                });
                paletteContainer.appendChild(btn);
            });
        }

        function updatePaletteSelection() {
            const swatches = paletteContainer.querySelectorAll('.color-swatch');
            swatches.forEach((swatch, index) => {
                if (PALETTE[index] === selectedColor) {
                    swatch.classList.add('selected');
                } else {
                    swatch.classList.remove('selected');
                }
            });
        }

        function formatTime(ms) {
            if (ms < 0) ms = 0;
            const totalSeconds = Math.floor(ms / 1000);
            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;
            return `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        function startLocalHoldTimer(startTime) {
            if (localHoldTimeInterval) clearInterval(localHoldTimeInterval);
            
            const updateTime = () => {
                const now = Date.now();
                const heldFor = now - startTime;
                holdTimeEl.textContent = formatTime(heldFor);
            };
            
            updateTime(); // initial call
            localHoldTimeInterval = setInterval(updateTime, 1000);
        }

        function startCooldown() {
            cooldownActive = true;
            cooldownOverlay.classList.add('active');
            let timeLeft = COOLDOWN_DURATION;
            
            const tick = () => {
                timeLeft -= 100;
                cooldownTimerEl.textContent = (timeLeft / 1000).toFixed(1);
                
                if (timeLeft <= 0) {
                    clearInterval(interval);
                    cooldownActive = false;
                    cooldownOverlay.classList.remove('active');
                }
            };
            
            tick();
            const interval = setInterval(tick, 100);
        }

        function getUserDisplayName() {
             // Retrieve name from local storage or fallback to anon ID
             const storedName = localStorage.getItem('pixel_username');
             if (storedName) return storedName;
             
             if (currentUser && currentUser.displayName) return currentUser.displayName;
             
             return currentUser ? `Anon-${currentUser.uid.substring(0, 5)}` : 'Unknown';
        }

        // --- Authentication ---
        async function initAuth() {
            return new Promise((resolve, reject) => {
                const unsubscribe = onAuthStateChanged(auth, (user) => {
                    unsubscribe(); // Only need to catch the first state
                    if (user) {
                        console.log("Authenticated as:", user.uid);
                        currentUser = user;
                        setupUserProfile();
                        resolve(user);
                    } else {
                        signInAnonymously(auth)
                            .then((cred) => {
                                currentUser = cred.user;
                                setupUserProfile();
                                resolve(cred.user);
                            })
                            .catch((error) => {
                                console.error("Auth error:", error);
                                showError("Could not connect to authentication service. Did you enable Anonymous Auth in Firebase?");
                                reject(error);
                            });
                    }
                });
            });
        }

        function setupUserProfile() {
            userInfoSection.classList.remove('hidden');
            const currentName = getUserDisplayName();
            
            // Show default Anon name as placeholder (greyed out) if no custom name is set
            if (currentName.startsWith('Anon-')) {
                 usernameInput.value = '';
                 usernameInput.placeholder = currentName;
            } else {
                 usernameInput.value = currentName;
                 usernameInput.placeholder = "Enter username...";
            }

            saveUsernameBtn.addEventListener('click', async () => {
                const newName = usernameInput.value.trim();
                
                if (!newName) {
                    showError("Please enter a username.");
                    return;
                }
                
                if (newName.length > 15) {
                    showError("Username must be 15 characters or less.");
                    return;
                }

                // Temporarily disable the button while checking/saving
                saveUsernameBtn.disabled = true;
                saveUsernameBtn.textContent = '...';

                const normalizedName = newName.toLowerCase();
                // Store claimed usernames in a separate public collection to ensure uniqueness
                const profileRef = doc(db, 'artifacts', appId, 'public', 'data', 'userProfiles', normalizedName);

                try {
                    await runTransaction(db, async (transaction) => {
                        const profileSnap = await transaction.get(profileRef);
                        
                        // Check if another user has already claimed this exact username
                        if (profileSnap.exists() && profileSnap.data().uid !== currentUser.uid) {
                            throw new Error("USERNAME_TAKEN");
                        }
                        
                        // Claim the username in the unique registry
                        transaction.set(profileRef, {
                            uid: currentUser.uid,
                            displayName: newName
                        });
                        
                        // Update leaderboard doc if it exists to reflect the new name immediately
                        const lbRef = getLeaderboardDocRef(currentUser.uid);
                        const lbSnap = await transaction.get(lbRef);
                        if (lbSnap.exists()) {
                            transaction.update(lbRef, { name: newName });
                        }
                    });

                    // If transaction succeeds, update local state
                    localStorage.setItem('pixel_username', newName);
                    
                    // Try to update Firebase profile if possible
                    try {
                        await updateProfile(currentUser, { displayName: newName });
                    } catch (e) {
                        console.log("Could not update firebase profile, using local name only", e);
                    }

                    // Success visuals
                    saveUsernameBtn.textContent = 'Saved!';
                    saveUsernameBtn.classList.replace('bg-indigo-600', 'bg-emerald-600');
                    saveUsernameBtn.classList.replace('border-indigo-600', 'border-emerald-600');
                    
                    setTimeout(() => {
                        saveUsernameBtn.disabled = false;
                        saveUsernameBtn.textContent = 'Save';
                        saveUsernameBtn.classList.replace('bg-emerald-600', 'bg-indigo-600');
                        saveUsernameBtn.classList.replace('border-emerald-600', 'border-indigo-600');
                    }, 2000);

                } catch (error) {
                    console.error("Username save error:", error);
                    saveUsernameBtn.disabled = false;
                    saveUsernameBtn.textContent = 'Save';
                    
                    if (error.message === "USERNAME_TAKEN") {
                        showError("That username is already taken. Please choose another.");
                    } else {
                        showError("Failed to save username. Please try again. Check your Firestore Security Rules.");
                    }
                }
            });
        }

        // --- Database Interactions ---

        function getPixelDocRef() {
            return doc(db, 'artifacts', appId, 'public', 'data', PIXEL_COLLECTION_NAME, 'theOnlyPixel');
        }

        function getLeaderboardCollectionRef() {
            return collection(db, 'artifacts', appId, 'public', 'data', LEADERBOARD_COLLECTION_NAME);
        }
        
        function getLeaderboardDocRef(uid) {
            return doc(db, 'artifacts', appId, 'public', 'data', LEADERBOARD_COLLECTION_NAME, uid);
        }

        async function initializeDatabase() {
            const pixelRef = getPixelDocRef();
            
            try {
                // Check if pixel doc exists, if not create default
                const docSnap = await getDoc(pixelRef);
                if (!docSnap.exists()) {
                    await setDoc(pixelRef, {
                        color: '#ffffff',
                        ownerId: 'system',
                        ownerName: 'The Void',
                        captureTime: serverTimestamp()
                    });
                }
            } catch (error) {
                console.error("Initialization error:", error);
                if (error.code === 'permission-denied') {
                    showError("Firebase Permission Denied. You need to update your Firestore Security Rules to allow reads and writes.");
                }
            }
        }

        function subscribeToPixelState() {
            if (!currentUser) return;

            const pixelRef = getPixelDocRef();
            
            onSnapshot(pixelRef, (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    currentPixelState = data;
                    
                    // Update UI
                    pixelEl.style.backgroundColor = data.color;
                    ownerNameEl.textContent = data.ownerName;
                    ownerColorEl.style.backgroundColor = data.color;
                    
                    // Start timer
                    if (data.captureTime) {
                        // Use server timestamp if available, otherwise fallback to local estimate
                        const captureTimeMs = data.captureTime.toMillis ? data.captureTime.toMillis() : Date.now();
                        startLocalHoldTimer(captureTimeMs);
                        lastKnownOwnerTime = captureTimeMs;
                    }

                    // Visual flair on change
                    pixelContainer.style.transform = 'scale(1.05)';
                    setTimeout(() => {
                        pixelContainer.style.transform = 'scale(1)';
                    }, 150);
                }
            }, (error) => {
                console.error("Snapshot error:", error);
            });
        }

        async function capturePixel() {
            if (!currentUser) {
                showError("You must be connected to play.");
                return;
            }
            if (cooldownActive) return;

            const newOwnerId = currentUser.uid;
            const newOwnerName = getUserDisplayName();
            const pixelRef = getPixelDocRef();

            startCooldown();

            try {
                await runTransaction(db, async (transaction) => {
                    const pixelDoc = await transaction.get(pixelRef);
                    if (!pixelDoc.exists()) throw "Pixel document does not exist!";

                    const currentData = pixelDoc.data();
                    const prevOwnerId = currentData.ownerId;
                    
                    const captureTimeMs = Date.now(); 

                    // 1. Calculate time held for PREVIOUS owner
                    if (prevOwnerId && prevOwnerId !== 'system' && currentData.captureTime) {
                        const previousCaptureTimeMs = currentData.captureTime.toMillis ? currentData.captureTime.toMillis() : captureTimeMs;
                        const timeHeldMs = captureTimeMs - previousCaptureTimeMs;
                        
                        if (timeHeldMs > 0) {
                            const prevOwnerLeaderboardRef = getLeaderboardDocRef(prevOwnerId);
                            const prevOwnerDoc = await transaction.get(prevOwnerLeaderboardRef);
                            
                            let totalTime = timeHeldMs;
                            let prevName = currentData.ownerName; 

                            if (prevOwnerDoc.exists()) {
                                totalTime += prevOwnerDoc.data().totalTimeHeld;
                            }

                            transaction.set(prevOwnerLeaderboardRef, {
                                uid: prevOwnerId,
                                name: prevName,
                                totalTimeHeld: totalTime,
                                lastUpdated: captureTimeMs
                            });
                        }
                    }

                    // 2. Update Pixel State with NEW owner
                    transaction.update(pixelRef, {
                        color: selectedColor,
                        ownerId: newOwnerId,
                        ownerName: newOwnerName,
                        captureTime: Timestamp.fromMillis(captureTimeMs)
                    });
                });

                console.log("Pixel captured successfully!");

            } catch (error) {
                console.error("Capture transaction failed: ", error);
                if (error.code === 'permission-denied') {
                    showError("Permission denied! Have you updated your Firestore security rules?");
                } else {
                    showError("Failed to capture pixel. Someone might have beaten you to it!");
                }
            }
        }

        // --- Leaderboard ---

        function subscribeToLeaderboard() {
            if (!currentUser) return;
            
            const lbRef = getLeaderboardCollectionRef();
            const q = query(lbRef); 

            onSnapshot(q, (snapshot) => {
                const leaderboardData = [];
                snapshot.forEach((doc) => {
                    leaderboardData.push(doc.data());
                });

                // Client-side sorting (highest total time first)
                leaderboardData.sort((a, b) => b.totalTimeHeld - a.totalTimeHeld);

                renderLeaderboard(leaderboardData);
            }, (error) => {
                console.error("Leaderboard snapshot error:", error);
            });
        }

        function renderLeaderboard(data) {
            leaderboardList.innerHTML = '';
            
            if (data.length === 0) {
                leaderboardList.innerHTML = '<div class="text-center text-slate-500 p-4">No records yet. Be the first!</div>';
                return;
            }

            // Display top 100
            const displayData = data.slice(0, 100);

            displayData.forEach((entry, index) => {
                const isCurrentUser = entry.uid === currentUser.uid;
                
                const row = document.createElement('div');
                row.className = `leaderboard-row flex items-center p-3 rounded-xl mb-1 ${isCurrentUser ? 'bg-indigo-900/40 border border-indigo-500/30' : 'hover:bg-slate-700/50'}`;
                
                // Rank styling
                let rankVisual = `<span class="w-8 text-center font-mono font-bold text-slate-500">${index + 1}</span>`;
                if (index === 0) rankVisual = `<span class="w-8 text-center text-xl">👑</span>`;
                if (index === 1) rankVisual = `<span class="w-8 text-center text-xl">🥈</span>`;
                if (index === 2) rankVisual = `<span class="w-8 text-center text-xl">🥉</span>`;

                row.innerHTML = `
                    ${rankVisual}
                    <div class="flex-1 ml-3 truncate">
                        <span class="font-medium text-slate-200 ${isCurrentUser ? 'text-indigo-300' : ''}">
                            ${entry.name || 'Unknown'}
                        </span>
                        ${isCurrentUser ? '<span class="ml-2 text-[10px] bg-indigo-600 text-white px-1.5 py-0.5 rounded uppercase font-bold tracking-wider">You</span>' : ''}
                    </div>
                    <div class="font-mono text-sm text-slate-400 bg-slate-900/50 px-2 py-1 rounded">
                        ${formatTime(entry.totalTimeHeld)}
                    </div>
                `;
                leaderboardList.appendChild(row);
            });
        }

        // --- Event Listeners ---
        pixelContainer.addEventListener('click', capturePixel);
        
        pixelContainer.addEventListener('touchstart', (e) => {
            e.preventDefault();
            capturePixel();
        }, { passive: false });

        // --- Main Init ---
        async function boot() {
            buildPalette();
            updatePaletteSelection();
            
            if (!firebaseConfig.apiKey) return; // Stop booting if config is missing
            
            try {
                await initAuth();
                await initializeDatabase();
                subscribeToPixelState();
                subscribeToLeaderboard();
            } catch (e) {
                console.error("Boot sequence failed", e);
            }
        }

        // Start
        window.addEventListener('DOMContentLoaded', boot);

    </script>
</body>
</html>
