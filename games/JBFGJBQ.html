<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JBFGJBQ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Fira+Code:wght@500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #030712;
            color: #f3f4f6;
            overflow: hidden;
        }

        .font-mono {
            font-family: 'Fira Code', monospace;
        }

        /* Signal waves pulse animation */
        @keyframes wavePulse {
            0% {
                opacity: 0.1;
                transform: translateX(-10px) scale(0.9);
            }
            50% {
                opacity: 1;
                transform: translateX(0) scale(1.05);
            }
            100% {
                opacity: 0.1;
                transform: translateX(10px) scale(0.9);
            }
        }

        .wave-1 { animation: wavePulse 1.2s infinite ease-in-out; animation-delay: 0.0s; }
        .wave-2 { animation: wavePulse 1.2s infinite ease-in-out; animation-delay: 0.3s; }
        .wave-3 { animation: wavePulse 1.2s infinite ease-in-out; animation-delay: 0.6s; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center relative select-none">

    <!-- Background Audio (Replace 'background.mp3' with your audio file path) -->
    <audio id="bgAudio" src="background.mp3" loop></audio>

    <!-- Audio Mute/Unmute Toggle Button -->
    <button id="audioToggleBtn" class="fixed top-4 right-4 z-20 p-2.5 rounded-full bg-slate-900/80 border border-slate-800 text-slate-400 hover:text-white hover:border-slate-700 transition-all backdrop-blur-md shadow-lg" title="Toggle Background Audio">
        <svg id="audioIconMuted" class="w-5 h-5 stroke-current" fill="none" viewBox="0 0 24 24" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M17.25 9.75L19.5 12m0 0l2.25 2.25M19.5 12l2.25-2.25M19.5 12l-2.25 2.25m-10.5-6l4.72-4.72a.75.75 0 011.28.531V19.94a.75.75 0 01-1.28.53l-4.72-4.72H4.51c-.414 0-.75-.336-.75-.75V9c0-.414.336-.75.75-.75h4.24z" />
        </svg>
        <svg id="audioIconPlaying" class="w-5 h-5 stroke-current hidden text-cyan-400" fill="none" viewBox="0 0 24 24" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19.114 5.636a9 9 0 010 12.728M16.463 8.287a5.25 5.25 0 010 7.426M11.25 4.51l-4.72 4.72H4.51c-.414 0-.75.336-.75.75v6c0 .414.336.75.75.75h4.24l4.72 4.72a.75.75 0 001.28-.53V5.041a.75.75 0 00-1.28-.531z" />
        </svg>
    </button>

    <!-- Zooming Stars Canvas Background -->
    <canvas id="warpCanvas" class="fixed inset-0 z-0 pointer-events-none"></canvas>

    <!-- Main Interface Card -->
    <div id="mainContainer" class="relative z-10 w-full max-w-xl mx-4 p-8 md:p-12 bg-slate-900/80 border border-slate-800 rounded-3xl backdrop-blur-xl shadow-2xl text-center transition-all duration-500">
        
        <!-- Status Header Text -->
        <div class="mb-10">
            <h1 id="statusText" class="text-2xl md:text-3xl font-extrabold tracking-tight text-white transition-colors duration-300">
                Connecting<span class="animate-pulse">...</span>
            </h1>
            <p id="subStatusText" class="text-xs md:text-sm text-slate-400 font-mono mt-2 transition-colors duration-300">
                Connecting to JBFGJBQ Services
            </p>
        </div>

        <!-- Icons & Connection Zone -->
        <div class="flex items-center justify-between gap-4 my-8 px-2 md:px-6 relative min-h-[100px]">
            
            <!-- Laptop Icon -->
            <div class="flex flex-col items-center gap-2">
                <div id="laptopContainer" class="p-4 rounded-2xl bg-slate-800/80 border border-slate-700 text-slate-200 transition-all duration-300">
                    <svg class="w-12 h-12 md:w-16 md:h-16 stroke-current" fill="none" viewBox="0 0 24 24" stroke-width="1.5">
                        <rect x="3" y="4" width="18" height="12" rx="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M2 20h20" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M9 16v1h6v-1" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
            </div>

            <!-- In-Between Signal / Error Space -->
            <div class="flex-1 flex items-center justify-center relative h-16">
                
                <!-- Active Signal Waves: ))) -->
                <div id="signalContainer" class="flex items-center gap-1.5 md:gap-2 text-cyan-400">
                    <svg class="w-6 h-10 md:w-8 md:h-12 wave-1" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                        <path d="M9 18c2.5-3 2.5-9 0-12" stroke-linecap="round"/>
                    </svg>
                    <svg class="w-6 h-10 md:w-8 md:h-12 wave-2" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                        <path d="M13 20c4.5-5 4.5-11 0-16" stroke-linecap="round"/>
                    </svg>
                    <svg class="w-6 h-10 md:w-8 md:h-12 wave-3" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                        <path d="M17 22c6.5-7 6.5-13 0-20" stroke-linecap="round"/>
                    </svg>
                </div>

                <!-- Error X (Hidden by default, shown after 7 seconds) -->
                <div id="errorXContainer" class="hidden flex-col items-center justify-center">
                    <div class="w-12 h-12 md:w-16 md:h-16 rounded-full bg-red-500/20 border-2 border-red-500 flex items-center justify-center text-red-500 shadow-[0_0_20px_rgba(239,68,68,0.5)]">
                        <svg class="w-8 h-8 md:w-10 md:h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
                        </svg>
                    </div>
                </div>

            </div>

            <!-- Server Icon -->
            <div class="flex flex-col items-center gap-2">
                <div id="serverContainer" class="p-4 rounded-2xl bg-slate-800/80 border border-slate-700 text-slate-200 transition-all duration-300">
                    <svg class="w-12 h-12 md:w-16 md:h-16 stroke-current" fill="none" viewBox="0 0 24 24" stroke-width="1.5">
                        <rect x="4" y="3" width="16" height="7" rx="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <rect x="4" y="14" width="16" height="7" rx="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <line x1="8" y1="6.5" x2="8.01" y2="6.5" stroke-width="2.5" stroke-linecap="round"/>
                        <line x1="8" y1="17.5" x2="8.01" y2="17.5" stroke-width="2.5" stroke-linecap="round"/>
                        <line x1="12" y1="6.5" x2="16" y2="6.5" stroke-width="1.5" stroke-linecap="round"/>
                        <line x1="12" y1="17.5" x2="16" y2="17.5" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                </div>
            </div>

        </div>

        <!-- Retry Action (Hidden during connection) -->
        <div id="retryAction" class="hidden mt-6">
            <button id="retryBtn" class="px-6 py-2.5 rounded-xl bg-red-600 hover:bg-red-500 text-white font-medium text-sm transition-all shadow-lg shadow-red-500/20 active:scale-95 inline-flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                </svg>
                Try Again
            </button>
        </div>

    </div>

    <script>
        // --- HORIZONTAL STREAMING STARS BACKGROUND ---
        const canvas = document.getElementById('warpCanvas');
        const ctx = canvas.getContext('2d');

        let width = 0;
        let height = 0;
        let stars = [];
        const STAR_COUNT = 200;
        let animFrameId = null;
        let lastTime = 0;

        function resizeCanvas() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            initStars();
        }

        function initStars() {
            stars = [];
            for (let i = 0; i < STAR_COUNT; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    speed: Math.random() * 500 + 200, // Pixels per second
                    length: Math.random() * 20 + 6,
                    size: Math.random() * 1.5 + 0.5,
                    alpha: Math.random() * 0.7 + 0.3
                });
            }
        }

        function drawStars(timestamp) {
            if (!lastTime) lastTime = timestamp;
            // Calculate delta time in seconds, capped to prevent huge jumps
            const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
            lastTime = timestamp;

            ctx.fillStyle = '#030712';
            ctx.fillRect(0, 0, width, height);

            for (let i = 0; i < stars.length; i++) {
                let star = stars[i];

                // Stream star to the left bound to elapsed time (dt)
                star.x -= star.speed * dt;

                // Reset star when it moves past the left screen boundary
                if (star.x < -star.length) {
                    star.x = width + Math.random() * 40;
                    star.y = Math.random() * height;
                    star.speed = Math.random() * 500 + 200;
                    star.length = Math.random() * 20 + 6;
                }

                // Draw horizontal line streak moving left
                ctx.beginPath();
                ctx.moveTo(star.x + star.length, star.y);
                ctx.lineTo(star.x, star.y);
                ctx.strokeStyle = `rgba(186, 230, 253, ${star.alpha})`;
                ctx.lineWidth = star.size;
                ctx.stroke();
            }

            animFrameId = requestAnimationFrame(drawStars);
        }

        function startAnimation() {
            if (animFrameId) {
                cancelAnimationFrame(animFrameId);
            }
            lastTime = 0;
            animFrameId = requestAnimationFrame(drawStars);
        }

        window.addEventListener('resize', resizeCanvas);

        // --- CONNECTION STATE MACHINE & 7-SECOND TIMEOUT LOGIC ---
        let timeoutId = null;

        const statusText = document.getElementById('statusText');
        const subStatusText = document.getElementById('subStatusText');
        const signalContainer = document.getElementById('signalContainer');
        const errorXContainer = document.getElementById('errorXContainer');
        const retryAction = document.getElementById('retryAction');
        const retryBtn = document.getElementById('retryBtn');
        const mainContainer = document.getElementById('mainContainer');
        const laptopContainer = document.getElementById('laptopContainer');
        const serverContainer = document.getElementById('serverContainer');

        function startConnection() {
            // Reset UI states
            statusText.textContent = 'Connecting...';
            statusText.className = 'text-2xl md:text-3xl font-extrabold tracking-tight text-white transition-colors duration-300';
            subStatusText.textContent = 'Establishing link to remote server';
            subStatusText.className = 'text-xs md:text-sm text-slate-400 font-mono mt-2 transition-colors duration-300';

            signalContainer.classList.remove('hidden');
            errorXContainer.classList.add('hidden');
            retryAction.classList.add('hidden');

            laptopContainer.className = 'p-4 rounded-2xl bg-slate-800/80 border border-slate-700 text-cyan-400 transition-all duration-300';
            serverContainer.className = 'p-4 rounded-2xl bg-slate-800/80 border border-slate-700 text-slate-200 transition-all duration-300';

            // Set 7-second timeout for error state
            clearTimeout(timeoutId);
            timeoutId = setTimeout(triggerError, 7000);
        }

        function triggerError() {
            // Error visual feedback
            statusText.textContent = 'Connection Failed';
            statusText.className = 'text-2xl md:text-3xl font-extrabold tracking-tight text-red-500 transition-colors duration-300';
            
            subStatusText.textContent = 'Error: Failed to connect to live services.';
            subStatusText.className = 'text-xs md:text-sm text-red-400 font-mono mt-2 transition-colors duration-300';

            signalContainer.classList.add('hidden');
            errorXContainer.classList.remove('hidden');
            retryAction.classList.remove('hidden');

            laptopContainer.className = 'p-4 rounded-2xl bg-slate-800/80 border border-red-500/30 text-slate-400 transition-all duration-300';
            serverContainer.className = 'p-4 rounded-2xl bg-slate-800/80 border border-red-500/30 text-slate-400 transition-all duration-300';
        }

        retryBtn.addEventListener('click', startConnection);

        // Initialize on load
        window.onload = function() {
            resizeCanvas();
            startAnimation();
            startConnection();
            initAudio();
        };

        // --- BACKGROUND AUDIO CONTROLLER ---
        const bgAudio = document.getElementById('bgAudio');
        const audioToggleBtn = document.getElementById('audioToggleBtn');
        const audioIconMuted = document.getElementById('audioIconMuted');
        const audioIconPlaying = document.getElementById('audioIconPlaying');

        function updateAudioUI(isPlaying) {
            if (isPlaying) {
                audioIconMuted.classList.add('hidden');
                audioIconPlaying.classList.remove('hidden');
            } else {
                audioIconMuted.classList.remove('hidden');
                audioIconPlaying.classList.add('hidden');
            }
        }

        function toggleAudio() {
            if (bgAudio.paused) {
                bgAudio.play().then(() => {
                    updateAudioUI(true);
                }).catch(err => {
                    console.log("Audio waiting for user interaction or valid file:", err);
                });
            } else {
                bgAudio.pause();
                updateAudioUI(false);
            }
        }

        function initAudio() {
            audioToggleBtn.addEventListener('click', toggleAudio);

            // Play automatically on first user click anywhere if browser blocked initial autoplay
            const enableAudioOnInteraction = () => {
                if (bgAudio.paused) {
                    bgAudio.play().then(() => {
                        updateAudioUI(true);
                    }).catch(() => {});
                }
            };

            window.addEventListener('click', enableAudioOnInteraction, { once: true });
        }
    </script>
</body>
</html>
